<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS</title><style>body{background:#03101d;color:#8eeaff;font:16px system-ui;margin:0}main{max-width:800px;margin:auto;padding:24px}header{letter-spacing:5px;border-bottom:1px solid #26758a;padding:20px}.core{width:180px;height:180px;border:5px double cyan;border-radius:50%;display:grid;place-items:center;margin:30px auto;box-shadow:0 0 35px #1686ad;animation:pulse 3s infinite}@keyframes pulse{50%{box-shadow:0 0 60px #1686ad}}@media(prefers-reduced-motion:reduce){.core{animation:none}}textarea,button{background:#09263a;color:inherit;border:1px solid #26758a;padding:12px;border-radius:8px;font:inherit}textarea{width:95%;height:100px}button{margin:4px}#out{white-space:pre-wrap;padding:20px;border:1px solid #26758a;min-height:100px}select,input{background:#09263a;color:inherit;padding:10px;border:1px solid #26758a;max-width:100%}@media print{header,.core,button,textarea,select,input,label,#status{display:none}body{background:white;color:black}#out{border:0}}</style><header>J.A.R.V.I.S. / SCHOLAR 02</header><main><div class="core">JARVIS</div><p id="status">Prototype — backend required</p><div id="out" aria-live="polite">Enter a question or paste study notes.</div><p><label for="mode">Study mode </label><select id="mode"><option>General assistant</option><option>Explain for beginners</option><option>Exam-ready 10-mark answer</option><option>Short answers</option><option>Generate practice quiz</option><option>Summarize notes</option></select></p><p><label for="notes">Load text notes locally: </label><input id="notes" type="file" accept=".txt,.md,text/plain"></p><p><textarea id="q" aria-label="Question"></textarea></p><button id="send">Ask JARVIS</button><button id="voice">Voice input</button><button id="read">Read aloud</button><button onclick="window.print()">Save PDF</button><p>Voice uses browser services. Avoid entering sensitive personal information.</p></main><script>const e=id=>document.getElementById(id);e('send').onclick=async()=>{if(!e('q').value.trim())return;e('status').textContent='Working';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:e("mode").value+": "+e("q").value})});if(!r.ok)throw Error();e('out').textContent=(await r.json()).answer;e('status').textContent='Ready'}catch{e('status').textContent='Backend unavailable'}};e('voice').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){e('status').textContent='Voice unsupported';return}const r=new R();r.lang='en-GB';r.onresult=x=>e('q').value=x.results[0][0].transcript;r.onerror=()=>e('status').textContent='Voice unavailable';r.start()};e('read').onclick=()=>{const u=new SpeechSynthesisUtterance(e('out').textContent);u.lang='en-GB';speechSynthesis.cancel();speechSynthesis.speak(u)};e("notes").onchange=async()=>{const f=e("notes").files[0];if(!f)return;if(f.size>100000){e("status").textContent="File too large";return}const t=await f.text();if(t.length>28000){e("status").textContent="Notes exceed 28,000 characters";return}e("q").value=t;e("status").textContent="Notes loaded locally; Send to request analysis"};</script></html>
