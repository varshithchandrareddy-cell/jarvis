<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS</title><style>
*{box-sizing:border-box}body{margin:0;background:#181818;color:#eee;font:16px system-ui}button,textarea,select{font:inherit;color:inherit;background:#292929;border:1px solid #444;border-radius:12px;padding:10px}button{cursor:pointer}button:hover{background:#404040}header{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid #333}header strong{font-size:21px}main{max-width:800px;margin:auto;padding:20px;display:flex;flex-direction:column;min-height:calc(100dvh - 70px)}#chat{flex:1;min-height:45vh;overflow-wrap:anywhere}.welcome{text-align:center;margin:12vh 0 30px}.welcome h1{font-size:30px}.bubble{white-space:pre-wrap;padding:15px;margin:12px 0;line-height:1.6}.user{background:#303030;border-radius:20px;margin-left:15%}.assistant{border-bottom:1px solid #333}.composer{position:sticky;bottom:0;background:#181818;padding:12px 0}.panel{background:#252525;border:1px solid #444;border-radius:24px;padding:12px}textarea{width:100%;resize:vertical;min-height:85px;background:transparent;border:0;outline:none}.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.send{background:#eee;color:#111;margin-left:auto}.muted{font-size:12px;color:#aaa;text-align:center}#status{font-size:13px;color:#bbb}aside{display:none;padding:15px;background:#202020}aside.open{display:block}@media print{header,.composer,aside{display:none}body{background:white;color:black}.user{background:#eee}}
body,.composer{background:#050e19}header,aside{background:#081726;border-color:#183c56}.panel,button,select{background:#0b2033;border-color:#245779}button:hover{background:#12344e}.send{background:#48cfff;color:#04121e}.user{background:#102b43}.assistant{border-color:#183c56}.orb{width:112px;height:112px;margin:0 auto 24px;border:3px double #5de5ff;border-radius:50%;box-shadow:0 0 25px #167baf,inset 0 0 20px #124f75;display:grid;place-items:center;color:#9cecff;letter-spacing:2px;animation:glow 3s infinite}.mini-orb{width:22px;height:22px;border:2px solid #55ddff;border-radius:50%;box-shadow:0 0 10px #219ed1}@keyframes glow{50%{box-shadow:0 0 45px #1686ad,inset 0 0 20px #124f75}}@media(prefers-reduced-motion:reduce){.orb{animation:none}} </style><header><button id="menu" aria-label="Menu">☰</button><span class='mini-orb' aria-hidden='true'></span><strong>JARVIS</strong><select id="mode" aria-label="Assistant mode"><option>General</option><option>Study</option><option>Quiz</option><option>Summarize</option><option>Exam preparation</option><option>Video planning</option></select></header><aside id="sidebar"><button id="new">+ New chat</button> <button id="export">Print / Save PDF</button><p>Conversation is kept only in this open page.</p></aside><main><section id="chat" aria-live="polite"><div class="welcome"><div class="orb" aria-hidden="true">JARVIS</div><h1>How can I help you?</h1><p>Study, explore, create and solve problems.</p><button class="suggest">Explain a difficult concept</button> <button class="suggest">Make a study plan</button></div></section><div class="composer"><div id="status" role="status"></div><div class="panel"><textarea id="q" placeholder="Ask JARVIS anything..." aria-label="Message"></textarea><div class="tools"><button id="attach" title="Attach text notes">＋ Notes</button><input type="file" id="file" accept=".txt,.md,.csv" hidden><button id="voice">Mic</button><button id="read">Read aloud</button><button id="video">Video</button><button class="send" id="send">↑ Send</button></div></div><p class="muted">Prototype. AI may make mistakes. Do not share sensitive information.</p></div></main><script>
const e=id=>document.getElementById(id);let history=[],last='',busy=false;
function add(role,msg){document.querySelector('.welcome')?.remove();const d=document.createElement('div');d.className='bubble '+role;d.textContent=msg;e('chat').append(d);d.scrollIntoView({block:'nearest'});}
e('menu').onclick=()=>e('sidebar').classList.toggle('open');e('new').onclick=()=>{if(!busy){history=[];last='';e('chat').replaceChildren();e('status').textContent='New chat';}};e('export').onclick=()=>window.print();document.querySelectorAll('.suggest').forEach(b=>b.onclick=()=>{e('q').value=b.textContent;e('q').focus()});
e('attach').onclick=()=>e('file').click();e('file').onchange=async()=>{const f=e('file').files[0];if(!f)return;if(f.size>20000){e('status').textContent='Text notes must be under 20 KB';return}e('q').value+='\nNotes: '+await f.text();e('file').value='';};
async function send(){const q=e('q').value.trim();if(!q||busy)return;busy=true;e('send').disabled=true;e('q').value='';add('user',q);e('status').textContent='Thinking…';try{const message='Mode: '+(e('mode').value==='Video planning'?'Video planning only: create a storyboard and script, do not claim to render video':e('mode').value)+'\n'+history.slice(-8).map(x=>x.role+': '+x.text).join('\n').slice(-12000)+'\nUser: '+q;const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});if(!r.ok)throw Error();last=(await r.json()).answer;add('assistant',last);history.push({role:'User',text:q},{role:'Assistant',text:last});e('status').textContent=''}catch{add('assistant','AI service is not configured or unavailable.');e('status').textContent='Offline';}finally{busy=false;e('send').disabled=false;}}
e('video').onclick=()=>{e('mode').value='Video planning';e('status').textContent='Video planning available after AI activation. Actual video rendering is not connected.';e('q').placeholder='Describe your video idea...';e('q').focus()};e('send').onclick=send;e('q').onkeydown=x=>{if(x.key==='Enter'&&!x.shiftKey&&!x.isComposing){x.preventDefault();send()}};e('voice').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){e('status').textContent='Voice unsupported';return}const r=new R();r.lang='en-GB';r.onresult=x=>e('q').value=x.results[0][0].transcript;r.onerror=()=>e('status').textContent='Microphone unavailable';r.start()};e('read').onclick=()=>{if(!last)return;const u=new SpeechSynthesisUtterance(last);u.lang='en-GB';speechSynthesis.cancel();speechSynthesis.speak(u)};
</script></html>
